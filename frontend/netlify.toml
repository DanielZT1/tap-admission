[build]
  command = "pnpm build"
  publish = "dist/tap-admission-frontend/browser"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.19.0"

[[redirects]]
  from = "/api/*"
  to = "https://REPLACE_WITH_YOUR_RENDER_BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
